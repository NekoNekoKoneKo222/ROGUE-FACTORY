# Node web service + websocket game server. Neon optional, configured separately.
services:
  - type: web
    name: rogue-factory
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
